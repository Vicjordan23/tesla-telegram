name: Publicar en Telegram

on:
  workflow_dispatch:
    inputs:
      producto:
        description: "ID de un producto concreto para probar (vacio = el de la franja)"
        required: false
        default: ""

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Publicar el siguiente accesorio
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCTO_FORZADO: ${{ inputs.producto }}
        run: python3 publicar_siguiente.py
