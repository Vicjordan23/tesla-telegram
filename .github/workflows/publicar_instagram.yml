name: Publicar en Instagram

on:
  workflow_dispatch: {}

jobs:
  publicar:
    # Reactivado el 15/11/2026 (Vic): ahora publica la foto real del producto, no tarjetas dibujadas.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publicar el carrusel de esta franja
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          VENTANA: "08:00-23:30"
        run: python3 publicar_instagram.py
