name: Publicar en Instagram

on:
  workflow_dispatch: {}

jobs:
  publicar:
    # PAUSADO 18/11/2026: prueba de reactivacion fallo igual (Meta 2207051 sigue bloqueando media_publish). Al reactivar usar IG_CADA=4.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publicar el carrusel de esta franja
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          VENTANA: "08:00-23:30"
          IG_CADA: "4"
        run: python3 publicar_instagram.py
