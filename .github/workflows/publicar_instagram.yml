name: Publicar en Instagram

on:
  workflow_dispatch: {}

jobs:
  publicar:
    # Reactivado 18/11/2026 con menos frecuencia (IG_CADA=4: 1 foto cada 2 h) tras el bloqueo de Meta 2207051.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publicar el carrusel de esta franja
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          VENTANA: "08:00-23:30"
          IG_CADA: "1"
        run: python3 publicar_instagram.py
