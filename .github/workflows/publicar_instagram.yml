name: Publicar en Instagram

on:
  workflow_dispatch:
    inputs:
      producto:
        description: "ID de un producto concreto para probar (vacio = el de la franja)"
        required: false
        default: ""

jobs:
  publicar:
    # REACTIVADO 20/11/2026 por Vic: 2 publicaciones al dia (IG_CADA=16 = 1 de cada 16 franjas = cada 8 h, 2 dentro de la ventana). Si Meta devuelve 2207051, volver a pausar.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publicar el carrusel de esta franja
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          VENTANA: "08:00-23:30"
          PRODUCTO_FORZADO: ${{ inputs.producto }}
          IG_CADA: "16"
        run: python3 publicar_instagram.py
